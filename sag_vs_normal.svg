<text x="507.0" y="414.6" class="small" text-anchor="start">nodo</text>
<text x="463.7" y="378.3" class="ln" text-anchor="end">u·n̂</text>
<text x="505.0" y="363.6" class="lz" text-anchor="start">Δz</text>
<g transform="translate(640,110)">
 <line x1="0" y1="0" x2="34" y2="0" class="nom"/><text x="44" y="5" class="small">superficie nominal</text>
 <line x1="0" y1="24" x2="34" y2="24" class="dfm"/><text x="44" y="29" class="small">superficie deformada</text>
 <text x="0" y="62" class="lu">u: desplazamiento FEM del nodo</text>
 <text x="0" y="96" class="ln">Normal  u·n̂</text>
 <text x="0" y="116" class="small">distancia medida perpendicular a la superficie</text>
 <text x="0" y="150" class="lz">Cambio de sag  Δz = (u·n̂) / n_z</text>
 <text x="0" y="170" class="small">diferencia de altura z a la misma posición (x, y);</text>
 <text x="0" y="188" class="small">n_z = cos θ. En un espejo plano Δz = u·n̂.</text>
 <text x="0" y="222" class="small">La componente de u a lo largo de la superficie</text>
 <text x="0" y="240" class="small">desliza el nodo sin cambiar la forma.</text>
</g>
